services:
  postgres:
    image: postgres:16
    container_name: birly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: birlydb
      POSTGRES_USER: birly_user
      POSTGRES_PASSWORD: birlypass
    ports:
      - "5432:5432"
    volumes:
      - birly_pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: birly-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@birly.com
      PGADMIN_DEFAULT_PASSWORD: birlypass
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  birly_pgdata:
  pgadmin_data: