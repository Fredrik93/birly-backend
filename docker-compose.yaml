version: "3.8"
services:
  postgres:
    image: postgres:16
    container_name: billboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: billboard
      POSTGRES_USER: billboard_user
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - billboard_pgdata:/var/lib/postgresql/data

volumes:
  billboard_pgdata: